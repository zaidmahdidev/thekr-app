name: Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
      #      - name: Analyze
      #        run: flutter analyze

      #      - name: Run tests
      #        run: flutter test

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Clean previous builds
        run: flutter clean

      - name: Get dependencies again after clean
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --verbose

      - name: Verify AAB file exists and show build structure
        run: |
          echo "Searching for AAB files:"
          find . -name "*.aab" -type f
          echo "Build directory structure:"
          ls -la build/ || echo "No build directory"
          ls -la build/app/ || echo "No build/app directory"
          ls -la build/app/outputs/ || echo "No build/app/outputs directory"
          ls -la build/app/outputs/bundle/ || echo "No build/app/outputs/bundle directory"
          ls -la build/app/outputs/bundle/release/ || echo "No build/app/outputs/bundle/release directory"
          if [ ! -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "AAB file not found at expected location!"
            exit 1
          fi

      - name: Create Play Store JSON
        run: |
          echo '${{ secrets.PLAY_STORE_JSON }}' > android/fastlane/play-store-service-account.json

      - name: Verify service account JSON
        run: |
          if [ ! -f "android/fastlane/play-store-service-account.json" ]; then
            echo "Service account JSON not found!"
            exit 1
          fi
          echo "Service account JSON file size:"
          wc -c android/fastlane/play-store-service-account.json
          echo "First few characters of JSON:"
          head -c 100 android/fastlane/play-store-service-account.json

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: android

      - name: Clean and install Fastlane dependencies
        run: |
          cd android
          rm -f Gemfile.lock
          bundle install

      - name: Debug file structure before deploy
        run: |
          echo "Current directory:"
          pwd
          echo "Contents of build/app/outputs/bundle/release/:"
          ls -la build/app/outputs/bundle/release/ || echo "Directory not found"
          echo "Contents from android directory perspective:"
          ls -la ../build/app/outputs/bundle/release/ || echo "Directory not found from android/"
          echo "All AAB files in the project:"
          find . -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"

      - name: Copy AAB to expected location (if needed)
        run: |
          # Find the actual AAB file location
          AAB_FILE=$(find . -name "app-release.aab" -type f | head -1)
          if [ -n "$AAB_FILE" ]; then
            echo "Found AAB file at: $AAB_FILE"
            # Create the expected directory structure
            mkdir -p build/app/outputs/bundle/release/
            # Copy the file to the expected location
            cp "$AAB_FILE" build/app/outputs/bundle/release/app-release.aab
            echo "Copied AAB file to expected location"
            ls -la build/app/outputs/bundle/release/
          else
            echo "No AAB file found anywhere in the project"
            exit 1
          fi

      - name: Deploy to Google Play
        run: |
          cd android
          bundle exec fastlane deploy
