name: Flutter CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
      #      - name: Analyze
      #        run: flutter analyze

      #      - name: Run tests
      #        run: flutter test

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build Android APK (signed)
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Verify AAB file exists
        run: |
          if [ ! -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "AAB file not found!"
            exit 1
          fi
          ls -la build/app/outputs/bundle/release/

      - name: Create Play Store JSON
        run: |
          echo '${{ secrets.PLAY_STORE_JSON }}' > android/fastlane/play-store-service-account.json

      - name: Verify service account JSON
        run: |
          if [ ! -f "android/fastlane/play-store-service-account.json" ]; then
            echo "Service account JSON not found!"
            exit 1
          fi
          echo "Service account JSON file size:"
          wc -c android/fastlane/play-store-service-account.json
          echo "First few characters of JSON:"
          head -c 100 android/fastlane/play-store-service-account.json

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: android

      - name: Clean and install Fastlane dependencies
        run: |
          cd android
          rm -f Gemfile.lock
          bundle install

      - name: Deploy to Google Play
        run: |
          cd android
          fastlane deploy
